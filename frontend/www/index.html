<!doctype html>
<!--
  KHUNG APP (App Shell) - AICF Coffee · app bán hàng nội bộ cho chủ quán, quản lý và nhân viên.
  Giao diện theo app nhân viên của dự án AICF (nhan-vien.html): thanh trên cùng, nội dung cuộn ở giữa,
  thanh điều hướng dưới cùng; mọi thao tác mở trong hộp thoại kéo lên (sheet).
  Chỉ có 1 trang HTML (Single Page App): router (js/core/router.js) đổi nội dung #view theo địa chỉ sau dấu #
  (vd. #/tables, #/kitchen) mà không tải lại trang -> chuyển màn hình nhanh như app gốc.
  Cùng 1 bộ giao diện này chạy được:
    - trên trình duyệt / cài lên màn hình chính như app (PWA, nhờ manifest + service worker)
    - đóng gói thành app Android bằng Capacitor (thư mục ../android)
-->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2b1810">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="App bán hàng của quán cà phê: sơ đồ bàn, gọi món, pha chế, thu tiền, tổng quan doanh thu, Trợ lý AI">
  <title>AICF Coffee · Bán hàng</title>

  <!-- PWA: thông tin cài đặt app (tên, biểu tượng, màu) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AICF">
  <meta name="format-detection" content="telephone=no">

  <link rel="preload" href="fonts/BeVietnamPro-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <!-- style.css: nền tảng (màu, phông, nút, ô nhập, thẻ); staff.css: khung app nhân viên. Cả 2 lấy từ AICF -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/staff.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="st-body">
  <div class="st-shell">
    <!-- Thanh trên: logo + tên quán + đang mở cửa + chuông thông báo + ảnh đại diện (vẽ trong js/app.js) -->
    <header class="st-header" id="header" hidden></header>
    <!-- Nội dung từng màn hình được vẽ vào đây (cuộn riêng, thanh trên / dưới đứng yên) -->
    <main class="st-main" id="view" aria-live="polite"></main>
    <!-- Thanh điều hướng dưới: các mục thay đổi theo vai trò (chủ quán / quản lý / nhân viên) -->
    <nav class="st-nav" id="tabbar" aria-label="Điều hướng" hidden></nav>
  </div>

  <!-- Vùng hiện thông báo nổi -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript>Ứng dụng cần bật JavaScript.</noscript>

  <!-- type="module": dùng import/export chuẩn ES, không cần công cụ build -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
